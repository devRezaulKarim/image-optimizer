name: Build and Release Windows Installer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Install npm dependencies
        run: npm ci

      - name: Run Build Script
        shell: pwsh
        run: |
          $ver = "1.0.${{ github.run_number }}"
          .\build.ps1 -Version $ver

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Image Optimizer v1.0.${{ github.run_number }}"
          body: |
            ## Image Optimizer v1.0.${{ github.run_number }}
            
            ### ✨ What's New:
            - **Custom Icon**: Added a clean application icon embedded in the installer, executable, and system tray.
            - **Universal Windows (10/11) Compatibility**: Works out of the box with zero external software required.
            - **No Image Overwrites**: Dropping duplicate image names automatically generates `photo (1).webp`, `photo (2).webp`, etc.
            - **Windows Pictures Integration**: Monitors `%USERPROFILE%\Pictures\optimize` (`webp`, `jpg`, `png`).
            - **Silent Windows Startup**: Starts minimized in the system tray when Windows boots.
            
            ---
            
            ### 🛡️ Windows SmartScreen Note:
            Because this is a freshly compiled open-source installer without an expensive commercial EV certificate, Windows SmartScreen may show:
            > *"Windows protected your PC - Microsoft Defender SmartScreen prevented an unrecognized app from starting"*
            
            **To run the installer:**
            1. Click **"More info"** on the popup.
            2. Click the **"Run anyway"** button.
            *(Or right-click `ImageOptimizer-Setup.exe` ➔ Properties ➔ check **Unblock** ➔ Apply).*
            
            ---
            
            ### 📥 Download:
            Download **`ImageOptimizer-Setup.exe`** below to install.
          files: dist/ImageOptimizer-Setup.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
